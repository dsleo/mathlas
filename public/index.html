#stage{position:absolute;inset:0;overflow:hidden}
#stage::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .2  0 0 0 0 .2  0 0 0 0 .15  0 0 0 .9 0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>")}
#map{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none;display:block}

#map *:focus{outline:none}
.world-minor{opacity:clamp(0,calc((var(--k) - 1.7)/1.2),1)}
.world-major{opacity:clamp(.6,calc((var(--k) - 1)/.9),1)}
.world-river{opacity:clamp(0,calc((var(--k) - 1.25)/.9),1)}
.lbl{font-style:italic;font-weight:600;stroke-linejoin:round;paint-order:stroke}
.hud{position:absolute;z-index:5;top:14px;left:14px;right:14px;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
.hud>*{pointer-events:auto}
.btn{border:1px solid var(--ink);background:var(--paper);color:var(--text);cursor:pointer;font-size:14px;min-height:36px;padding:0 13px;text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap}
.title{padding:2px 4px;max-width:520px;font-size:21px;font-weight:600;text-shadow:0 0 6px var(--sea),0 0 3px var(--sea),0 0 10px var(--sea)}
.ib{width:32px;height:32px;min-height:0;padding:0;border-radius:50%;justify-content:center;font-size:15px;color:var(--muted);border-color:var(--line);background:color-mix(in srgb,var(--paper) 90%,transparent)}.ib:hover{color:var(--text);border-color:var(--ink)}
.info{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;margin-left:6px;border:1px solid var(--muted);border-radius:50%;font:italic 600 11px/1 Georgia,serif;color:var(--muted);cursor:help;vertical-align:1px}.info:hover,.info:focus{color:var(--text);border-color:var(--ink);outline:0}
#core button.xbtn{border:0;background:none;color:var(--text);min-height:0;padding:0 4px}.xbtn{border:0;background:none;cursor:pointer;font-size:26px;line-height:1;color:var(--text);padding:0 4px}
.sp{margin-left:auto}
.panel{border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 96%,transparent)}
#stats{position:absolute;z-index:4;left:14px;top:56px;width:244px;padding:12px 14px;max-height:calc(100vh - 250px);overflow:auto}
#stats h3{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center;cursor:pointer}#stats h3::after{content:'\25BE';font-size:13px}#stats.shut h3::after{content:'\25B8'}#leg{margin-top:8px}#stats.shut #leg{display:none}#stats.shut{padding-bottom:10px}
.row{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:8px;align-items:center;cursor:pointer;padding:3px 4px;border:1px solid transparent;font-size:15px}
.row:hover{border-color:#b9ae97}.row.on{border-color:var(--ink);background:var(--tint)}
.row i{width:12px;height:12px;border-radius:50%;border:1.3px solid var(--ink)}.row .n{font-size:14px;font-variant-numeric:tabular-nums}
.row .bar{grid-column:2 / span 2;height:3px;background:var(--tint);margin-top:-1px}.row .bar u{display:block;height:3px}
.hint{font-size:13px;font-style:italic;color:var(--muted);margin-top:6px}
.dock{position:absolute;z-index:4;left:14px;right:14px;bottom:14px;display:grid;grid-template-columns:150px minmax(0,1fr);border:1px solid var(--ink);background:var(--paper);box-shadow:3px 4px 0 rgba(59,68,56,.18)}
.clock{border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px}
#year{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
#play{width:42px;height:42px;border-radius:50%;border:1px solid var(--ink);background:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
#play svg{width:15px;height:15px;fill:var(--paper)}
.clock small{font-size:12px;color:var(--muted);text-align:center;line-height:1.25;font-style:italic}
#rail{position:relative;height:96px;cursor:ew-resize;touch-action:none;user-select:none}
#rail svg{position:absolute;inset:0;width:100%;height:100%}
#panel{position:absolute;z-index:6;top:0;right:0;bottom:0;width:min(430px,100vw);overflow:auto;padding:18px 20px 28px;background:var(--sea);border-left:1px solid var(--ink);box-shadow:-6px 0 18px rgba(45,53,43,.14);display:none}
#panel h2{margin:0 0 2px;font-size:25px;line-height:1.15;font-weight:600}

#panel ul{list-style:none;margin:0;padding:0}
#panel li{display:grid;grid-template-columns:50px 12px minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:16px;line-height:1.25;align-items:baseline;cursor:pointer}

#panel .x{position:absolute;right:12px;top:6px;cursor:pointer;font-size:24px;line-height:1;border:0;background:none}
#panel .back{font-style:italic;color:var(--muted);cursor:pointer;font-size:15px}
#panel .why{font-size:17px;line-height:1.4;margin:10px 0 12px}

.st{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;padding:8px 4px;border-top:1px solid var(--line);align-items:start}
.st:nth-child(odd){background:var(--tint)}.st .y{font-size:14px}.st small{display:block;font-size:11px;color:var(--muted);letter-spacing:.05em;margin-top:2px;text-transform:uppercase}
.ln{margin-top:9px;height:0;border-top:2.5px solid var(--ink)}.ln.pencil{border-top:2px solid #8c8378}.ln.dots{border-top:2px dotted #8c8378}
.btns{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap;align-items:center}
.btns button,#core button{border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;font-size:14px;min-height:34px;padding:0 13px}

.tip2{font-size:13px;font-style:italic;color:var(--muted)}
.ppl{font-size:15.5px;line-height:1.4;margin-top:6px}
#core{position:absolute;left:24px;right:24px;top:18px;bottom:18px;z-index:8;background:var(--paper);border:1px solid var(--ink);box-shadow:5px 6px 0 rgba(59,68,56,.22);overflow:auto;padding:24px 30px;display:none}
#core .hd{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
#core h2{margin:0;font-size:32px;line-height:1.1;font-weight:600}
#core .grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:30px}
#core .layer{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:14px 10px;border-top:1px solid var(--line)}
#core .layer:nth-child(odd){background:var(--tint)}
#core .layer .y{font-size:17px}#core .layer h3{margin:0 0 3px;font-weight:600;font-size:20px;line-height:1.2}#core .layer p{margin:3px 0;font-size:16px;line-height:1.4}

.fb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-size:17px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.fb:hover,.fb.on{border-color:var(--ink)}.fb svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#fab{position:absolute;z-index:7;right:14px;bottom:14px;display:flex;flex-direction:column-reverse;gap:8px;align-items:center}
#menu{display:none;flex-direction:column;gap:8px;position:relative}#fab.open #menu{display:flex}
#menu .w{position:relative}
.pop{position:absolute;right:50px;bottom:0;background:var(--paper);border:1px solid var(--line);box-shadow:0 6px 22px rgba(0,0,0,.22);padding:6px;display:none;min-width:230px}.pop.on{display:block}
.pop .it{display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:pointer;font-size:16px;border:0;background:none;width:100%;text-align:left;color:var(--text)}.pop .it:hover{background:var(--tint)}

const SRCH=[...F.map((f,i)=>({k:'f',i,t:f.id,n:norm(f.id),sub:'field'})),...[...new Set(PPL.map(p=>p.name))].map(n=>({k:'p',t:n,n:norm(n),sub:'person'})),...EV.map(e=>({k:'e',p:e.p,t:e.n,n:norm(e.n),sub:F[e.f].id+' \u00b7 '+fmtY(e.y)}))];
let peopleIn=false;function addPeople(){if(peopleIn||!EVD)return;peopleIn=true;const by=new Map();Object.entries(EVD).forEach(([pid,d])=>(d.people||[]).forEach(p=>{if(!p.name||PSETN.has(p.name))return;if(!by.has(p.name))by.set(p.name,[]);by.get(p.name).push(pid)}));by.forEach((l,n)=>{l.sort((x,y)=>EVP.get(x).y-EVP.get(y).y);SRCH.push({k:'q',p:l[0],t:n,n:norm(n),sub:'person \u00b7 '+l.length+(l.length>1?' events':' event')})})}
const focusField=i=>{const w=Math.max(260,rOf(sizeAt(i,T))*5.2),h=w*vb.h/vb.w;vb.x=ISL[i].cx-w/2;vb.y=ISL[i].cy-h/2;vb.w=w;vb.h=h;fit()};
const goField=i=>{sel=i;selE=null;selP='';lastKey=null;focusField(i);render();ensureEvd()};
const goEvent=pid=>{const e=EVP.get(pid);if(T<e.y)T=Math.min(2025,e.y+8);prevT=T;selP='';selE=pid;sel=e.f;lastKey=null;focusField(e.f);render();ensureEvd()};
const runSearch=()=>{const q=norm($('sq').value).trim();if(!q){$('sr').innerHTML='';return}const words=q.split(/\s+/);const hits=SRCH.filter(r=>words.every(w=>r.n.includes(w))).sort((a,b)=>(b.n.startsWith(q)-a.n.startsWith(q))||({f:0,p:1,q:1,e:2}[a.k]-{f:0,p:1,q:1,e:2}[b.k])).slice(0,14);$('sr').innerHTML=hits.map((r,i)=>`<button class="it" data-i="${SRCH.indexOf(r)}">${esc(r.t)}<small>${esc(r.sub)}</small></button>`).join('')||'<div class="it" style="cursor:default;color:var(--muted)">Nothing found</div>'};
$('sq').addEventListener('input',runSearch);
$('sq').addEventListener('keydown',e=>{if(e.key==='Enter'){const b=$('sr').querySelector('button');if(b)b.click()}e.stopPropagation()});
$('sr').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const r=SRCH[+b.dataset.i];$('psearch').classList.remove('on');if(r.k==='e'||r.k==='q')goEvent(r.p);else if(r.k==='f')goField(r.i);else{const i=PPL.findIndex(x=>x.name===r.t);pickPerson(i)}});
$('bsearch').onclick=()=>{ensureEvd();shut('psearch');const o=$('psearch').classList.toggle('on');if(o)setTimeout(()=>$('sq').focus(),0)};
// deep links: #e=<event id> | #p=<person> | #f=<field>, plus &core (open core sample) and &t=<year>
let hashT=0;
function writeHash(){const q=[];if(selE)q.push('e='+selE);else if(selP)q.push('p='+encodeURIComponent(selP));else if(sel>=0)q.push('f='+encodeURIComponent(F[sel].id));if(coreOpen)q.push('core');if(q.length||Math.round(T)!==2025)q.push('t='+Math.round(T));try{history.replaceState(null,'',location.pathname+location.search+(q.length?'#'+q.join('&'):''))}catch(_){}}
(()=>{const h=new URLSearchParams(location.hash.slice(1));if(h.has('t')&&isFinite(+h.get('t')))T=prevT=Math.max(-2000,Math.min(2025,+h.get('t')));
 const e=h.get('e'),p=h.get('p'),f=h.get('f');
 if(e&&EVP.has(e)){selE=e;sel=EVP.get(e).f;ensureEvd();if(h.has('core'))coreOpen=e}
 else if(p&&PPL.some(x=>x.name===p))selP=p;
 else if(f){const i=F.findIndex(x=>x.id===f);if(i>=0){sel=i;ensureEvd()}}})();
window.addEventListener('resize',()=>{fit();render()});fit();render();requestAnimationFrame(()=>{fit();render()});requestAnimationFrame(tick);
}
</script>
</html>
