name: Open correction review
on:
  issues:
    types: [closed]
permissions:
  contents: write
  pull-requests: write
jobs:
  record:
    if: contains(github.event.issue.labels.*.name, 'accepted') && contains(github.event.issue.labels.*.name, 'correction')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: rec
        run: |
          echo "n=$(python3 scripts/record_correction.py)" >> "$GITHUB_OUTPUT"
          python3 scripts/correction_brief.py > "$RUNNER_TEMP/brief.md"
      - name: Open a pull request for source review
        if: steps.rec.outputs.n != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N: ${{ steps.rec.outputs.n }}
        run: |
          branch="correction-$N"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add research/corrections/proposals
          git commit -m "Stage correction #$N for review"
          git push origin "$branch"
          { cat "$RUNNER_TEMP/brief.md"; printf '\n\n---\nThis pull request stages a repository review brief. Verify the offered source, apply any supported change to `data/events.json`, then record verification and publish the margin note as described in `AGENTS.md`. An accepted issue alone does not publish a correction. Closes #%s.\n' "$N"; } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$branch" --title "Review accepted correction #$N" --body-file "$RUNNER_TEMP/body.md"
