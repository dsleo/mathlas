name: Record accepted correction
on:
  issues:
    types: [closed]
permissions:
  contents: write
  pull-requests: write
jobs:
  record:
    if: contains(github.event.issue.labels.*.name, 'accepted') && contains(github.event.issue.labels.*.name, 'correction')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: rec
        run: echo "n=$(python3 scripts/record_correction.py)" >> "$GITHUB_OUTPUT"
      - name: Open a pull request
        if: steps.rec.outputs.n != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N: ${{ steps.rec.outputs.n }}
        run: |
          branch="correction-$N"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add public/data/corrections.json
          git commit -m "Record accepted correction #$N"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Record accepted correction #$N" \
            --body "Adds the accepted correction from #$N to the margin notes. Make the actual data fix in this pull request too, then merge. Closes #$N."
