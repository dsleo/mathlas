name: Record accepted correction
on:
  issues:
    types: [closed]
permissions:
  contents: write
  pull-requests: write
jobs:
  record:
    if: contains(github.event.issue.labels.*.name, 'accepted') && contains(github.event.issue.labels.*.name, 'correction')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: rec
        run: |
          echo "n=$(python3 scripts/record_correction.py)" >> "$GITHUB_OUTPUT"
          python3 scripts/correction_brief.py > "$RUNNER_TEMP/brief.md"
      - name: Open a pull request
        if: steps.rec.outputs.n != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N: ${{ steps.rec.outputs.n }}
        run: |
          branch="correction-$N"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add public/data/corrections.json
          git commit -m "Record accepted correction #$N"
          git push origin "$branch"
          { cat "$RUNNER_TEMP/brief.md"; printf '\n\n---\nThis pull request adds the margin note. To apply the correction, ask an agent to "apply the brief in this pull request", or edit `data/events.json` by hand, then merge. Closes #%s.\n' "$N"; } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$branch" --title "Record accepted correction #$N" --body-file "$RUNNER_TEMP/body.md"
