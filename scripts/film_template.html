:root{--sea:#f2efe7;--paper:#fbf8f0;--ink:#3b4438;--text:#2d352b;--muted:#5a604e;--line:#cbc2b4;--accent:#ae6b1f;--tint:var(--tint);--mapfilter:none;--imgfix:none}
:root[data-theme=night]{--sea:#0d1118;--paper:#141a22;--ink:#c9cdbf;--text:#e6e3d6;--muted:#97a08f;--line:#33403f;--accent:#e6a65a;--tint:#1c242c;--mapfilter:invert(1) hue-rotate(180deg);--imgfix:invert(1) hue-rotate(180deg)}
:root[data-theme=blueprint]{--sea:#12335c;--paper:#173d6b;--ink:#dbe8f6;--text:#eaf2fb;--muted:#9bb8d8;--line:#2f5a8c;--accent:#ffd36b;--tint:#1d4777;--mapfilter:invert(1) sepia(1) saturate(2.4) hue-rotate(172deg) brightness(.95);--imgfix:invert(1) sepia(1) saturate(2.4) hue-rotate(172deg)}

#stage{position:absolute;inset:0;overflow:hidden}
#stage::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .2  0 0 0 0 .2  0 0 0 0 .15  0 0 0 .9 0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>")}

.lbl{font-style:italic;font-weight:600;stroke-linejoin:round;paint-order:stroke}

.btn{border:1px solid var(--ink);background:var(--paper);color:var(--text);cursor:pointer;font-size:14px;min-height:36px;padding:0 13px;text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap}

.panel{border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 96%,transparent)}

.row{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:8px;align-items:center;cursor:pointer;padding:3px 4px;border:1px solid transparent;font-size:15px}
.row:hover{border-color:#b9ae97}.row.on{border-color:var(--ink);background:var(--tint)}
.row i{width:12px;height:12px;border-radius:50%;border:1.3px solid var(--ink)}.row .n{font-size:14px;font-variant-numeric:tabular-nums}
.row .bar{grid-column:2 / span 2;height:3px;background:var(--tint);margin-top:-1px}.row .bar u{display:block;height:3px}

.clock small{font-size:12px;color:var(--muted);text-align:center;line-height:1.25;font-style:italic}

#panel{position:absolute;z-index:6;top:0;right:0;bottom:0;width:min(430px,100vw);overflow:auto;padding:18px 20px 28px;background:var(--sea);border-left:1px solid var(--ink);box-shadow:-6px 0 18px rgba(45,53,43,.14);display:none}

#panel li:hover{background:var(--tint)}#panel li .y{font-size:13px;color:var(--muted)}#panel li i{width:10px;height:10px;border-radius:50%;display:inline-block}
#panel .x{position:absolute;right:12px;top:6px;cursor:pointer;font-size:24px;line-height:1;border:0;background:none}

#panel .why{font-size:17px;line-height:1.4;margin:10px 0 12px}
#panel .chip{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;margin:0 0 3px}.chip i{width:11px;height:11px;border-radius:50%;border:1.3px solid var(--ink)}
.st{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;padding:8px 4px;border-top:1px solid var(--line);align-items:start}
.st:nth-child(odd){background:var(--tint)}.st .y{font-size:14px}.st small{display:block;font-size:11px;color:var(--muted);letter-spacing:.05em;margin-top:2px;text-transform:uppercase}
.ln{margin-top:9px;height:0;border-top:2.5px solid var(--ink)}.ln.pencil{border-top:2px solid #8c8378}.ln.dots{border-top:2px dotted #8c8378}
.btns{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap;align-items:center}
.btns button,#core button{border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;font-size:14px;min-height:34px;padding:0 13px}
#core button.ghost{background:var(--paper);color:var(--text)}
.pen{color:var(--muted);text-decoration:none;margin-left:8px;font-size:15px;cursor:pointer;border:0!important}.pen:hover{color:var(--accent)}
.margin{margin:8px 0 2px;padding:6px 10px;border-left:2px dashed var(--accent);font-style:italic;font-size:15px;line-height:1.35;color:var(--text)}.margin small{color:var(--muted)}.margin a{color:inherit}
.tip2{font-size:13px;font-style:italic;color:var(--muted)}
.ppl{font-size:15.5px;line-height:1.4;margin-top:6px}
#core{position:absolute;left:24px;right:24px;top:18px;bottom:18px;z-index:8;background:var(--paper);border:1px solid var(--ink);box-shadow:5px 6px 0 rgba(59,68,56,.22);overflow:auto;padding:24px 30px;display:none}
#core .hd{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
#core h2{margin:0;font-size:32px;line-height:1.1;font-weight:600}
#core .grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:30px}
#core .layer{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:14px 10px;border-top:1px solid var(--line)}
#core .layer:nth-child(odd){background:var(--tint)}
#core .layer .y{font-size:17px}#core .layer h3{margin:0 0 3px;font-weight:600;font-size:20px;line-height:1.2}#core .layer p{margin:3px 0;font-size:16px;line-height:1.4}
#core .role{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

#core a,.ev a{color:var(--text);border-bottom:1px dotted var(--muted);text-decoration:none}
#core .gl{margin-top:10px;height:0;border-top:3px solid var(--ink)}#core .gl.pencil{border-top:2.5px solid #8c8378}#core .gl.dots{border-top:2.5px dotted #8c8378}#core .gl+div{font-size:11.5px;color:var(--muted);margin-top:4px}
#core .side h4{margin:0 0 6px;font-weight:600;letter-spacing:.1em;font-size:13px;color:var(--muted);text-transform:uppercase}
#core .person{border-top:1px solid var(--line);padding:8px 0;font-size:15.5px;line-height:1.35}
#core .note{font-size:14px;line-height:1.4;color:#4a5446;border:1px dashed #8c8378;padding:10px 12px;margin-top:14px}
.fb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-size:17px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.fb:hover,.fb.on{border-color:var(--ink)}.fb svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#fab{position:absolute;z-index:7;right:14px;bottom:14px;display:flex;flex-direction:column-reverse;gap:8px;align-items:center}
#menu{display:none;flex-direction:column;gap:8px;position:relative}#fab.open #menu{display:flex}
#menu .w{position:relative}
.pop{position:absolute;right:50px;bottom:0;background:var(--paper);border:1px solid var(--line);box-shadow:0 6px 22px rgba(0,0,0,.22);padding:6px;display:none;min-width:230px}.pop.on{display:block}
.pop .it{display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:pointer;font-size:16px;border:0;background:none;width:100%;text-align:left;color:var(--text)}.pop .it:hover{background:var(--tint)}
.pop .sw{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);flex:none}
#sq{width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);font-size:17px;padding:8px 10px;outline:0}
#sr{max-height:min(48vh,360px);overflow:auto;width:340px;max-width:calc(100vw - 90px)}#sr .it{font-size:15px;align-items:baseline}#sr small{color:var(--muted);margin-left:auto;white-space:nowrap;padding-left:8px}
#stats{display:none}body.ev #stats{display:block}.dock{display:none}body.tl .dock{display:grid;right:68px}
body.pn #fab{right:calc(min(430px,100vw) + 14px)}body.pn.tl .dock{right:calc(min(430px,100vw) + 68px)}
#tip{position:absolute;z-index:9;pointer-events:none;background:var(--paper);border:1px solid var(--ink);padding:5px 10px;font-size:14px;display:none;max-width:320px}
#tip small{color:var(--muted)}
#boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:italic;color:var(--muted);z-index:7;background:var(--sea)}
@media(max-width:820px){body.ev #stats{display:none}#panel{top:auto;height:50%;width:100%;border-left:0;border-top:1px solid var(--ink)}.dock{grid-template-columns:96px minmax(0,1fr)}#year{font-size:22px}}

<script>
const DATA=/*DATA*/{};
Promise.all([fetch('data/field-film-art.json').then(r=>r.json()),fetch('data/portraits.json').then(r=>r.json()).catch(()=>({}))]).then(([ART,PORT])=>{document.getElementById('boot').remove();start(ART,PORT)});
function start(ART,PORT){
const [W,H]=DATA.world,F=DATA.fields,EV=DATA.events,LK=DATA.links,TYPE=DATA.types,ISL=ART.islands;
const SEA='#f2efe7',PAPER='#fbf8f0',INK='#3b4438',TEXT='#2d352b',ACCENT='#ae6b1f';
const WASH={analytic:'#f0f4e6',algebraic:'#f7ece4',geometric:'#f2f1e2',discrete:'#f7f2d9',logic:'#f6eedb'};
const HUE={halo:'#ebe6d8',light:'#c4ccbb',dark:'#4a5446',peak:'#f4f1e5'};
const f1=v=>v.toFixed(1);
const ramp=x=>x<=0?0:x>=1?1:x*x*(3-2*x);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtY=y=>y<0?Math.abs(y)+' BCE':String(y);
const ROLE=r=>String(r||'').replace(/_/g,' ');
const SYMFONT="\'LM Serif\',\'LM Blackboard\',\'LM Fraktur\',\'LM Script\',Georgia,\'Times New Roman\',\'STIX Two Text\',\'STIX Two Math\',\'Cambria Math\',\'Apple Symbols\',serif";
const SHORT={'Group & representation theory':'Groups','Category & homological algebra':'Categories','Functional & harmonic analysis':'Functional analysis','Statistics & decision theory':'Statistics','Logic & foundations':'Logic','Algorithms & complexity':'Algorithms','Astronomy & trigonometry':'Astronomy','Information & cryptography':'Cryptography','Differential equations':'Diff. equations','Differential geometry':'Diff. geometry','Game theory & economics':'Game theory'};
// ---- the sea and the islands (drawn once, at their final size) ------------------------------------------------------
const svg=document.getElementById('map');
const fams=[...new Set(ISL.map(i=>i.family))];

let pd=null,moved=0;svg.addEventListener('pointerdown',e=>{pd={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y};moved=0;svg.classList.add('drag')});
window.addEventListener('pointermove',e=>{if(!pd)return;const k=vb.w/svg.clientWidth,dx=e.clientX-pd.x,dy=e.clientY-pd.y;moved=Math.max(moved,Math.hypot(dx,dy));vb.x=pd.vx-dx*k;vb.y=pd.vy-dy*k;fit()});
window.addEventListener('pointerup',e=>{if(pd&&moved<5){const t=e.target.closest&&e.target.closest('[data-f]'),te=e.target.closest&&e.target.closest('[data-e]');const tp=e.target.closest&&e.target.closest('[data-p]');if(te)pickEvent(te.dataset.e);else if(tp)pickPerson(+tp.dataset.p);else if(t){sel=+t.dataset.f;selE=null;selP='';lastKey=null;render();ensureEvd()}}pd=null;svg.classList.remove('drag');render()});
svg.addEventListener('wheel',e=>{e.preventDefault();const k=Math.exp(e.deltaY*.0012),r=svg.getBoundingClientRect(),mx=vb.x+(e.clientX-r.left)/r.width*vb.w,my=vb.y+(e.clientY-r.top)/r.height*vb.h,nw=Math.max(120,Math.min(vb0.w*1.8,vb.w*k)),nh=nw*vb.h/vb.w;vb.x=mx-(mx-vb.x)*nw/vb.w;vb.y=my-(my-vb.y)*nh/vb.h;vb.w=nw;vb.h=nh;fit();render()},{passive:false});
const tip=document.getElementById('tip');
svg.addEventListener('pointermove',e=>{const t=e.target.closest&&e.target.closest('[data-f]'),lk=e.target.closest&&e.target.closest('[data-l]'),te=e.target.closest&&e.target.closest('[data-e]');if(pd){tip.style.display='none';return}
 const show=html=>{tip.style.display='block';tip.style.left=Math.min(e.clientX+14,innerWidth-330)+'px';tip.style.top=e.clientY+12+'px';tip.innerHTML=html};
 const tpp=e.target.closest&&e.target.closest('[data-p]');if(tpp){const pp=PPL[+tpp.dataset.p];show(esc(pp.name)+' &middot; '+pp.e.length+' events<br><small>click to follow their work across the map</small>');return}
 if(te){const ev=EVP.get(te.dataset.e);show(esc(ev.n)+' &middot; '+fmtY(ev.y)+'<br><small>'+TYPE[ev.t].name+'</small>');return}
 if(lk){const p=PL[+lk.dataset.l],c={};p.y.forEach((y,k)=>{if(y<=T)c[p.t[k]]=(c[p.t[k]]||0)+1});const n=Object.values(c).reduce((a,b)=>a+b,0);show(esc(F[p.a].id)+' &harr; '+esc(F[p.b].id)+' &middot; '+n+' link'+(n==1?'':'s')+'<br><small>'+Object.entries(c).map(([k,v])=>TYPE[k].name+' '+v).join(', ')+'</small>');return}
 if(t){const i=+t.dataset.f;show(esc(F[i].id)+' &middot; '+Math.round(sizeAt(i,T))+' events by '+Math.round(T));return}
 tip.style.display='none'});
// ---- floating menu: search, time-lapse, theme, event types, credits ----------------------------------------------------------
const $=id=>document.getElementById(id),fab=$('fab'),B=document.body;
const pops=['psearch','ptheme'];const shut=keep=>pops.forEach(id=>{if(id!==keep)$(id).classList.remove('on')});
$('gear').onclick=()=>{const o=fab.classList.toggle('open');$('gear').setAttribute('aria-expanded',o);$('gear').classList.toggle('on',o);if(!o)shut()};
const flag=(cls,btn,on)=>{B.classList.toggle(cls,on);$(btn).classList.toggle('on',on)};
$('btl').onclick=()=>{flag('tl','btl',!B.classList.contains('tl'));shut();if(B.classList.contains('tl'))render()};
$('bev').onclick=()=>{flag('ev','bev',!B.classList.contains('ev'));shut();render()};
const THEMES=[['atlas','Old atlas','#f2efe7','#3b4438'],['night','Night engraving','#0d1118','#c9cdbf'],['blueprint','Blueprint','#12335c','#dbe8f6'],['parchment','Parchment','#e8dcc0','#4a3b24']];
const setTheme=k=>{document.documentElement.dataset.theme=k;try{localStorage.setItem('film-theme',k)}catch(_){}$('ptheme').querySelectorAll('.it').forEach(b=>b.classList.toggle('cur',b.dataset.k===k));$('ptheme').querySelectorAll('.ck').forEach(c=>c.textContent=c.dataset.k===k?'\u2713':'')};
$('ptheme').innerHTML=THEMES.map(t=>`<button class="it" data-k="${t[0]}"><span class="sw" style="background:linear-gradient(135deg,${t[2]} 50%,${t[3]} 50%)"></span>${t[1]}<span class="ck" data-k="${t[0]}" style="margin-left:auto"></span></button>`).join('');
$('ptheme').addEventListener('click',e=>{const b=e.target.closest('.it');if(b){setTheme(b.dataset.k);$('ptheme').classList.remove('on')}});
$('btheme').onclick=()=>{shut('ptheme');$('ptheme').classList.toggle('on')};
{let k='atlas';try{k=localStorage.getItem('film-theme')||k}catch(_){}setTheme(THEMES.some(t=>t[0]===k)?k:'atlas')}
const norm=v=>String(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const SRCH=[...F.map((f,i)=>({k:'f',i,t:f.id,n:norm(f.id),sub:'field'})),...[...new Set(PPL.map(p=>p.name))].map(n=>({k:'p',t:n,n:norm(n),sub:'person'})),...EV.map(e=>({k:'e',p:e.p,t:e.n,n:norm(e.n),sub:F[e.f].id+' \u00b7 '+fmtY(e.y)}))];
let peopleIn=false;function addPeople(){if(peopleIn||!EVD)return;peopleIn=true;const by=new Map();Object.entries(EVD).forEach(([pid,d])=>(d.people||[]).forEach(p=>{if(!p.name||PSETN.has(p.name))return;if(!by.has(p.name))by.set(p.name,[]);by.get(p.name).push(pid)}));by.forEach((l,n)=>{l.sort((x,y)=>EVP.get(x).y-EVP.get(y).y);SRCH.push({k:'q',p:l[0],t:n,n:norm(n),sub:'person \u00b7 '+l.length+(l.length>1?' events':' event')})})}
const focusField=i=>{const w=Math.max(260,rOf(sizeAt(i,T))*5.2),h=w*vb.h/vb.w;vb.x=ISL[i].cx-w/2;vb.y=ISL[i].cy-h/2;vb.w=w;vb.h=h;fit()};
const goField=i=>{sel=i;selE=null;selP='';lastKey=null;focusField(i);render();ensureEvd()};
const goEvent=pid=>{const e=EVP.get(pid);if(T<e.y)T=Math.min(2025,e.y+8);prevT=T;selP='';selE=pid;sel=e.f;lastKey=null;focusField(e.f);render();ensureEvd()};
const runSearch=()=>{const q=norm($('sq').value).trim();if(!q){$('sr').innerHTML='';return}const words=q.split(/\s+/);const hits=SRCH.filter(r=>words.every(w=>r.n.includes(w))).sort((a,b)=>(b.n.startsWith(q)-a.n.startsWith(q))||({f:0,p:1,q:1,e:2}[a.k]-{f:0,p:1,q:1,e:2}[b.k])).slice(0,14);$('sr').innerHTML=hits.map((r,i)=>`<button class="it" data-i="${SRCH.indexOf(r)}">${esc(r.t)}<small>${esc(r.sub)}</small></button>`).join('')||'<div class="it" style="cursor:default;color:var(--muted)">Nothing found</div>'};
$('sq').addEventListener('input',runSearch);
$('sq').addEventListener('keydown',e=>{if(e.key==='Enter'){const b=$('sr').querySelector('button');if(b)b.click()}e.stopPropagation()});
$('sr').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const r=SRCH[+b.dataset.i];$('psearch').classList.remove('on');if(r.k==='e'||r.k==='q')goEvent(r.p);else if(r.k==='f')goField(r.i);else{const i=PPL.findIndex(x=>x.name===r.t);pickPerson(i)}});
$('bsearch').onclick=()=>{ensureEvd();shut('psearch');const o=$('psearch').classList.toggle('on');if(o)setTimeout(()=>$('sq').focus(),0)};
// deep links: #e=<event id> | #p=<person> | #f=<field>, plus &core (open core sample) and &t=<year>
let hashT=0;
function writeHash(){const q=[];if(selE)q.push('e='+selE);else if(selP)q.push('p='+encodeURIComponent(selP));else if(sel>=0)q.push('f='+encodeURIComponent(F[sel].id));if(coreOpen)q.push('core');if(q.length||Math.round(T)!==2025)q.push('t='+Math.round(T));try{history.replaceState(null,'',location.pathname+location.search+(q.length?'#'+q.join('&'):''))}catch(_){}}
(()=>{const h=new URLSearchParams(location.hash.slice(1));if(h.has('t')&&isFinite(+h.get('t')))T=prevT=Math.max(-2000,Math.min(2025,+h.get('t')));
 const e=h.get('e'),p=h.get('p'),f=h.get('f');
 if(e&&EVP.has(e)){selE=e;sel=EVP.get(e).f;ensureEvd();if(h.has('core'))coreOpen=e}
 else if(p&&PPL.some(x=>x.name===p))selP=p;
 else if(f){const i=F.findIndex(x=>x.id===f);if(i>=0){sel=i;ensureEvd()}}})();
window.addEventListener('resize',()=>{fit();render()});fit();render();requestAnimationFrame(()=>{fit();render()});requestAnimationFrame(tick);
}
